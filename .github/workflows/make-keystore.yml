name: Make signing keystore (one time)

# Запускается один раз вручную. Создаёт постоянный ключ подписи для APK.
# Результат (4 значения для секретов) кладётся в артефакт keystore-secrets.
# Репозиторий должен быть приватным. После настройки секретов артефакт удалите.

on:
  workflow_dispatch:

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Создание ключа
        run: |
          PASS=$(openssl rand -hex 16)
          keytool -genkeypair -v -keystore tosto.jks -alias tosto \
            -keyalg RSA -keysize 2048 -validity 36500 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=Tosto, O=Tosto, C=RU"
          {
            echo "ANDROID_KEYSTORE_BASE64:"
            base64 -w 0 tosto.jks
            echo
            echo
            echo "ANDROID_KEYSTORE_PASSWORD:"
            echo "$PASS"
            echo
            echo "ANDROID_KEY_ALIAS:"
            echo "tosto"
            echo
            echo "ANDROID_KEY_PASSWORD:"
            echo "$PASS"
          } > keystore-secrets.txt

      - uses: actions/upload-artifact@v4
        with:
          name: keystore-secrets
          path: keystore-secrets.txt
          retention-days: 1
